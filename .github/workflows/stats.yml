name: Generate GitHub Stats Cards

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate Top Languages Card
        run: |
          curl -sSL "https://github-readme-stats.vercel.app/api/top-langs/?username=Silva-D-Romario&layout=compact&theme=gotham&hide_border=true&bg_color=0d1117&langs_count=8&locale=pt-br" -o profile/top-langs.svg

      - name: Generate GitHub Stats Card
        run: |
          curl -sSL "https://github-readme-stats.vercel.app/api?username=Silva-D-Romario&show_icons=true&theme=gotham&hide_border=true&bg_color=0d1117&locale=pt-br" -o profile/github-stats.svg

      - name: Generate GitHub Streak Card
        run: |
          curl -sSL "https://github-readme-streak-stats.herokuapp.com/?user=Silva-D-Romario&theme=gotham&hide_border=true&bg_color=0d1117&locale=pt-br" -o profile/github-streak.svg

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add profile/*.svg
          git diff --staged --quiet || git commit -m "🔄 Update GitHub stats cards [skip ci]"
          git push
